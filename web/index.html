<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VIORA — Luxury Salon & Member Access Mobile App. Interactive 360° haircuts, senior stylists, and curated beauty services.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VIORA">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>VIORA — Luxury Salon</title>
  <link rel="manifest" href="manifest.json">

  <!-- Luxury Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF8F5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #FFFFFF 0%, #FAF8F5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .brand-monogram {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #D4A373 0%, #A97448 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 700;
      color: #FFFFFF;
      box-shadow: 0 12px 30px -4px rgba(197, 146, 101, 0.4);
      margin-bottom: 24px;
      animation: pulseGlow 2.4s infinite ease-in-out;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #1F1E1C;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #C59265;
      margin-bottom: 32px;
    }

    .loading-bar {
      width: 140px;
      height: 3px;
      background: #EDE8E1;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar-inner {
      width: 40%;
      height: 100%;
      background: #C59265;
      position: absolute;
      left: 0;
      animation: shimmer 1.5s infinite ease-in-out;
      border-radius: 3px;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 12px 30px -4px rgba(197, 146, 101, 0.4);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 16px 40px -2px rgba(197, 146, 101, 0.6);
      }
    }

    @keyframes shimmer {
      0% { left: -40%; width: 40%; }
      50% { width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Luxury Splash Screen Loader -->
  <div id="loading-container">
    <div class="brand-monogram">V</div>
    <div class="brand-title">VIORA</div>
    <div class="brand-subtitle">Haute Coiffure &amp; Beauty</div>
    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Fade out the luxury splash screen
            const loader = document.getElementById('loading-container');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 500);
            }
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
